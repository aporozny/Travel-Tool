server {
    listen 80;
    server_name 100.67.86.49 115.64.73.50 drifttravel.app;

    root /home/andre/projects/drift/web/dist;
    index index.html index.htm;

    # API proxy
    location /api/ {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health/ {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin page. The React app draws the waitlist admin screen for any /admin* path
    # (App.web.tsx), so serve the app for both. The old redirect to /admin.html ran into
    # the ".html must exist" rule below and returned 404.
    location = /admin {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }
    location = /admin.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # Legal docs (Privacy Policy / Terms of Service) -- static, outside
    # web/dist so an `npm run build` (which wipes dist/) can't take this
    # offline. ^~ forces this prefix match ahead of the .html regex location
    # below, since alias-served files aren't under web/dist's try_files root.
    location ^~ /legal/ {
        alias /var/www/drift/legal/;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Campaign landing pages -- static, outside web/dist, same reasoning
    # as /legal/ above (a frontend build can never take these offline).
    location ^~ /campaigns/ {
        alias /var/www/drift/campaigns/;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed build assets -- the filename changes on every build, so it's
    # safe to cache forever. Fixes a real recurring bug (hit twice in one
    # session, 2026-08-23): with no Cache-Control set at all, browsers were
    # heuristically caching index.html itself, so visitors kept silently
    # running old JS bundles referencing an old, no-longer-served hash long
    # after a new version had been deployed.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must always be revalidated -- it's what points at the current
    # bundle hash, so it can never be allowed to go stale.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Photo upload: the image travels as base64 inside JSON (up to ~14 MB), far over
    # nginx's 1 MB default (that was a 413). Exact match, so only this one route
    # gets the bigger limit; the backend still refuses anything over 10 MB of image.
    location = /api/v1/community/upload {
        client_max_body_size 15m;
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Member photos saved by the backend into /var/www/drift/uploads (outside
    # web/dist, so a frontend build can never wipe them). File names are random
    # UUIDs, so they are safe to cache forever. nosniff plus a locked-down CSP mean
    # a file can only ever be shown as an image, never run as a page or script.
    location ^~ /uploads/ {
        alias /var/www/drift/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
